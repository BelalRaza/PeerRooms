[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerrooms"
version = "0.1.0"
description = "An in-memory low-level design project for student discussion rooms"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.32,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=5,<8"]

[tool.setuptools]
py-modules = ["seed"]

[tool.setuptools.packages.find]
include = ["peerrooms*", "web"]

[tool.setuptools.package-data]
web = ["*.html", "*.js", "*.css"]
"peerrooms.api" = ["swagger/*.js", "swagger/*.css", "swagger/*.png", "swagger/LICENSE", "swagger/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
